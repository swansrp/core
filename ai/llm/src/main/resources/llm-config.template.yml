# =============================================================================
# core/llm 模块读取的全部 yml 键（23 把，正源＝本模块代码里的 ${llm...} 占位符）
#   重新取证命令（改了代码就跑一次，模板必须跟着更新）：
#     cd server/framework/core/llm && grep -rho '\${llm[^}]*}' src/main/java | sort -u
#   机器对账腿＝LlmConfigTemplateCoverageTest（模板叶子键集合与代码 ${llm...} 占位符集合必须**完全相等**，
#     不是"模板 ⊇ 代码"：漏写一把＝现场照模板填完仍缺配置，多写一把＝模板承诺了代码不读的键，两种都判红）
#
# 用法：把需要的段落整块复制到你项目的 application-{profile}.yml，按【】里的说明逐项填空。
#      不填＝用这里标注的 core 默认值，装配照常完成；[] 内是「不写这行时的取值」。
#      标 🔁 的行＝还可被「系统参数管理页」运行期覆盖（改完立即生效，不用重启、不用发版）；
#      标 ✋ 的行＝bean 构造期由 @Value 固化，改了必须重启。
#      出厂密钥一律不落明文：真值走环境变量／.env，yml 里只写 ${KEY:} 占位符。
#      地址/模型名同理（2026-10-17 起 @MetaParam 出厂值留空）：库值优先于 yml，
#      出厂值一旦带环境绑定信息，清库重种时就会静默顶掉现场配置。
# =============================================================================
llm:

  # ---------------------------------------------------------------------------
  # ① 默认文本模型（三类消费方共用：同步 ChatLanguageModel、流式、后台 LLM 任务）
  #    取值链＝sys_config 优先 → 本节点回落。故这三把键在参数页有对应格时，yml 只是地板。
  # ---------------------------------------------------------------------------
  base-url:            # 【现场必配】OpenAI 兼容端点，通常含 /v1。[空]  🔁 sys_config: BASE_URL（同名格出厂留空＝yml 即正源；只有库里真填了值才顶掉这里）
  api-key:             # 【现场必配】密钥。参数页 API_KEY 出厂是占位符 sk-****（含 * 判未填）⇒ 这一行就是"地板"，不写则 live agent 链路报「大模型密钥未配置」。[空]  🔁 sys_config: API_KEY（库值优先）
  model-name:          # 【按需调整】默认模型名。[空]  🔁 sys_config: MODEL_NAME
  timeout-seconds:     # 【出厂默认即可】普通调用超时（秒）。[120]  🔁 sys_config: TIMEOUT_SECONDS

  # Agent 长任务用途（core AgentLiveModels／LiveModelFactory 走这条超时口径；地址密钥仍用上面默认）
  agent:
    timeout-seconds:   # 【出厂默认即可】编排单次调用可达数分钟。[600]  🔁 sys_config: AGENT_TIMEOUT_SECONDS

  # ---------------------------------------------------------------------------
  # ② 多模态（视觉）模型：扫描件/图片转 Markdown、图注生成
  #    留空一律回落上面的默认模型（默认模型多半不支持图片 ⇒ 要用视觉就三把都得填）
  # ---------------------------------------------------------------------------
  vision:
    base-url:          # 【未用扫描件解析则不动】[空→回落 llm.base-url]  🔁 sys_config: VISION_BASE_URL
    api-key:           # 【未用扫描件解析则不动】[空→回落 llm.api-key]  🔁 sys_config: VISION_API_KEY
    model-name:        # 【按需调整·视觉解析启用时】须支持图片输入，如 qwen-vl-max。[空→回落默认]  🔁 sys_config: VISION_MODEL_NAME
    timeout-seconds:   # 【出厂默认即可】图片转录耗时长。[180]  🔁 sys_config: VISION_TIMEOUT_SECONDS

  # ---------------------------------------------------------------------------
  # ③ HTTP 出口代理与同步重试（bean 构造期固化）
  # ---------------------------------------------------------------------------
  proxy:
    enable:            # 【按需调整·内网直连出公网时】true/false。[false]  ✋
    host:              # 【同上】代理主机。[空]  ✋
    port:              # 【同上】代理端口。[0]  ✋
  chat:
    max-attempts:      # 【出厂默认即可】同步路径总尝试次数（1＝不重试）。[1]  ✋

  # ---------------------------------------------------------------------------
  # ④ agent 会话存储与任务闸门（core/redis 在类路径时装配 Redis 实现，否则内存兜底）
  # ---------------------------------------------------------------------------
  agent-session:
    key-prefix:        # 【出厂默认即可】会话状态/事件流的 Redis 键前缀。[llm:agent:session:]  ✋
    ttl-seconds:       # 【按需调整】会话快照与事件流的键存活秒数，每次写入按当前值续期。[86400＝24 小时]  🔁 sys_config: AGENT_SESSION_TTL_SECONDS（「Agent会话保留(秒)」出厂留空＝按这里/默认）
                       #   ⚠️ 改运行期值只影响之后的写入：已存在的键寿命不变，下次被写才续成新值。
  agent-task-gate:
    key-prefix:        # 【出厂默认即可】任务互斥闸门键前缀。[llm:agent:task-gate:]  ✋
    orphan-millis:     # 【按需调整】属主心跳超过这个毫秒数即判失联、强删锁自愈。[90000＝90 秒]  🔁 sys_config: AGENT_TASK_GATE_ORPHAN_MILLIS（「Agent任务失联阈值(毫秒)」出厂留空＝按这里/默认）
                       #   ⚠️ 调小要小心：正常长任务的心跳间隔若大于此值，在跑的任务会被误判失联而双跑。

  # ---------------------------------------------------------------------------
  # ⑤ 流式应答缓冲（前端逐字刷新与断线重连的答案源）
  # ---------------------------------------------------------------------------
  stream-answer:
    key-prefix:            # 【出厂默认即可】[llm:stream:answer:]  ✋
    ttl-seconds:           # 【出厂默认即可】在途应答键存活秒数。[600]  ✋
    finished-ttl-seconds:  # 【按需调整】收口后答案保留秒数（前端刷新还能捞到）。[300]  ✋
    min-write-interval-ms: # 【出厂默认即可】节流写 Redis 的最小间隔，防高频重刷。[300]  ✋

  # ---------------------------------------------------------------------------
  # ⑥ 自建 SSE 流式读取（RawSseStreamingChatModel／流式编排）
  # ---------------------------------------------------------------------------
  streaming:
    idle-timeout-ms:       # 【出厂默认即可】两帧之间静默上限，超时判流断开。[15000]  ✋
    max-wait-ms:           # 【按需调整】整条流的全局等待上限（长思考会撞它）。[3600000＝1 小时]  ✋
