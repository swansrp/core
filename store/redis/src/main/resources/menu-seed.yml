# menu-seed.yml —— 框架菜单声明（core/redis 交付面）
# 缓存管理页端点＝RedisAdminController（redis 模块，包名 com.bidr.platform.redis 属历史遗留）。
# 导航锚点为骨架（同名 topnav 由 MenuDeclaration.mergeAll 并集合并）；
# 骨架字段必须与 authorization 份逐字一致，宿主缺席时 MenuSeeder 整支剪枝不种。
menus:
  - title: 系统管理
    path: SystemManage
    component: SystemManage
    icon: RightSquareOutlined
    children:
      - title: 缓存管理
        path: redis
        component: /framework/views/MainContent/redis/index.vue
        icon: SettingOutlined
